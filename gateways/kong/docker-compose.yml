version: '3.3'
services:
  fake_api:
    image: jaxgeller/lwan
    volumes:
      - ./../../data:/lwan/wwwroot
      - ./../../data/lwan.conf:/lwan/lwan.conf
    ports:
      - 8000:8080
    networks:
      - kong
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
  kong:
    image: kong:3.0-ubuntu
    volumes:
      - ./kong.yml:/kong.yml
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: kong.yml
    ports:
      - 8080:8000
    networks:
      - kong
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G

networks:
  kong:
