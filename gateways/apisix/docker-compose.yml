version: '3.3'
services:
  fake_api:
    image: jaxgeller/lwan
    volumes:
      - ./../../data:/lwan/wwwroot
      - ./../../data/lwan.conf:/lwan/lwan.conf
    ports:
      - 8000:8080
    networks:
      - apisix
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
  apisix:
    image: apache/apisix
    volumes:
      - ./config.yaml:/usr/local/apisix/conf/config.yaml
      - ./apisix.yaml:/usr/local/apisix/conf/apisix.yaml
    ports:
      - 8080:8080
    networks:
      - apisix
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G

networks:
  apisix:
